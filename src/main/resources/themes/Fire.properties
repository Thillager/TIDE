# base theme (light, dark, intellij, darcula, maclight or macdark); only used by theme editor
@baseTheme = dark
@accentColor = #ff0000
@background = #000

# Toolbar styling - black background
toolbar.background = #000000
toolbar.border.color = #ff0000

# Border styling - red for all borders
border.color = #ff0000
panel.border.color = #ff0000
window.border.color = #ff0000
component.border.color = #ff0000
